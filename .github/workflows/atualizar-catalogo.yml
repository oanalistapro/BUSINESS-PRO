
name: Atualizar catalogo Business Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Atualizar catalogo
        run: python scripts/atualizar_catalogo.py

      - name: Publicar catalogo atualizado
        run: |
          if ! git diff --quiet -- catalogo.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add catalogo.json
            git commit -m "Atualizar catalogo de aplicativos"
            git push
          fi
