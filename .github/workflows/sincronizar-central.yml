
name: Sincronizar BUSINESS PRO com CENTRAL ADM

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: business-central-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Firebase Admin
        run: npm install --no-save firebase-admin@13

      - name: Sincronizar Business Pro
        env:
          FIREBASE_BUSINESS_ADMIN: ${{ secrets.FIREBASE_BUSINESS_ADMIN }}
          FIREBASE_CENTRAL_ADMIN: ${{ secrets.FIREBASE_CENTRAL_ADMIN }}
        run: node scripts/sincronizar-central.cjs
