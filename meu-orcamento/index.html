<script>
(() => {
  "use strict";

  const MODULOS = {
    "MEU CURRÍCULO": "./meu-curriculo/",
    "MEU ORÇAMENTO": "./meu-orcamento/"
  };

  function normalizar(texto) {
    return String(texto || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toUpperCase()
      .trim();
  }

  const rotas = Object.entries(MODULOS).map(
    ([nome, url]) => ({
      nome: normalizar(nome),
      url
    })
  );

  document.addEventListener("click", function(evento) {
    const elemento = evento.target.closest(
      "[data-tool], button, a"
    );

    if (!elemento) return;

    const nome = normalizar(
      elemento.getAttribute("data-tool") ||
      elemento.textContent
    );

    const modulo = rotas.find(
      item => nome.includes(item.nome)
    );

    if (!modulo) return;

    // Impede a abertura do simulador antigo.
    evento.preventDefault();
    evento.stopPropagation();
    evento.stopImmediatePropagation();

    // Abre o aplicativo completo na pasta própria.
    window.location.assign(modulo.url);

  }, true);

  // Atualiza os links que já existirem no catálogo.
  function atualizarLinks() {
    document.querySelectorAll("[data-tool]").forEach(el => {
      const nome = normalizar(el.dataset.tool);
      const modulo = rotas.find(item => nome === item.nome);

      if (modulo) {
        el.setAttribute("title", "Abrir aplicativo completo");
        if (el.tagName === "A") {
          el.href = modulo.url;
        }
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", atualizarLinks);
  } else {
    atualizarLinks();
  }
})();
</script>
<!-- FIM DA CONEXÃO DOS APLICATIVOS -->
