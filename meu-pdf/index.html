
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root{
 --bg:#0d1019;
 --card:#191e2b;
 --input:#242b3a;
 --text:#f5f7ff;
 --muted:#a5aec1;
 --line:#354054;
 --accent:#ff812d;
 --blue:#427fff;
 --green:#21b981;
}
body.light{
 --bg:#f3f5fa;
 --card:#fff;
 --input:#f0f3f9;
 --text:#15213a;
 --muted:#65728b;
 --line:#dbe2ef;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,system-ui,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
[hidden]{display:none!important}
header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding:15px 4%;
 background:var(--card);
 border-bottom:1px solid var(--line);
 position:sticky;
 top:0;
 z-index:10;
}
.logo{
 font-size:25px;
 font-weight:900;
 color:var(--accent);
 letter-spacing:-1px;
}
.logo span{color:var(--text)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{
 border:1px solid var(--line);
 border-radius:11px;
 padding:11px 15px;
 color:var(--text);
 background:var(--input);
 font-weight:700;
}
button.primary{
 background:var(--accent);
 border-color:var(--accent);
 color:#151515;
}
button.blue{
 background:var(--blue);
 border-color:var(--blue);
 color:white;
}
button.green{
 background:var(--green);
 border-color:var(--green);
 color:#071810;
}
button:hover:not(:disabled){filter:brightness(1.1)}
.hero{
 text-align:center;
 padding:48px 16px;
 background:linear-gradient(135deg,#261b15,#14243f);
 color:white;
}
.hero h1{
 margin:0 0 12px;
 font-size:clamp(30px,5vw,48px);
}
.hero p{color:#cbd3e5;line-height:1.6}
main{max-width:1250px;margin:auto;padding:24px 16px 60px}
.search{
 width:100%;
 background:var(--card);
 color:var(--text);
 border:1px solid var(--line);
 padding:17px;
 border-radius:15px;
 font-size:16px;
 margin-bottom:16px;
}
.filters{
 display:flex;
 gap:9px;
 overflow:auto;
 padding-bottom:12px;
 margin-bottom:20px;
}
.filters button{
 white-space:nowrap;
 border-radius:30px;
}
.filters button.active{
 background:var(--accent);
 color:#111;
 border-color:var(--accent);
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:15px;
}
.tool{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:18px;
 padding:20px;
 cursor:pointer;
 transition:.2s;
 min-height:155px;
}
.tool:hover{
 transform:translateY(-3px);
 border-color:var(--accent);
}
.tool .emoji{font-size:35px;margin-bottom:13px}
.tool h3{margin:0 0 9px;font-size:18px}
.tool p{
 color:var(--muted);
 font-size:13px;
 line-height:1.5;
 margin:0;
}
.panel{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:20px;
 padding:23px;
 margin-bottom:20px;
}
.panel h2{margin:0 0 12px}
.muted{color:var(--muted);line-height:1.6}
.drop{
 display:block;
 text-align:center;
 border:2px dashed var(--line);
 border-radius:17px;
 background:var(--input);
 padding:35px 15px;
 cursor:pointer;
 margin:16px 0;
}
.drop strong{display:block;margin:10px}
.drop input{display:none}
.toolbar{
 display:flex;
 flex-wrap:wrap;
 gap:9px;
 margin:17px 0;
}
.field{
 display:block;
 margin:13px 0;
 font-weight:700;
}
.field input,.field select,.field textarea{
 display:block;
 width:100%;
 padding:13px;
 border-radius:10px;
 border:1px solid var(--line);
 background:var(--input);
 color:var(--text);
 margin-top:7px;
}
.field textarea{min-height:110px;resize:vertical}
.pages{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
 gap:12px;
 margin:20px 0;
}
.page{
 background:var(--input);
 border:1px solid var(--line);
 border-radius:12px;
 padding:10px;
 min-width:0;
}
.page img{
 width:100%;
 height:145px;
 object-fit:contain;
 background:#eee;
 border-radius:8px;
}
.page small{
 display:block;
 overflow-wrap:anywhere;
 margin:8px 0;
 color:var(--muted);
}
.page .toolbar{gap:4px;margin:7px 0 0}
.page button{flex:1;padding:8px 3px}
.status{
 color:var(--muted);
 min-height:22px;
 margin:15px 0;
 overflow-wrap:anywhere;
}
.result{
 border:1px solid var(--line);
 background:var(--input);
 padding:20px;
 border-radius:15px;
 margin-top:20px;
 text-align:center;
}
.result iframe{
 width:100%;
 height:55vh;
 border:1px solid var(--line);
 background:white;
 border-radius:10px;
 margin-top:15px;
}
.back{margin-bottom:18px}
.notice{
 background:var(--input);
 padding:13px;
 border-radius:11px;
 color:var(--muted);
 font-size:13px;
 line-height:1.6;
}
footer{
 text-align:center;
 color:var(--muted);
 padding:30px;
 border-top:1px solid var(--line);
}
@media(max-width:600px){
 header{padding:12px}
 .logo{font-size:20px}
 header button{font-size:12px;padding:9px}
 .hero{padding:35px 14px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .tool{padding:13px;min-height:150px}
 .tool h3{font-size:15px}
 .tool .emoji{font-size:28px}
 .panel{padding:15px}
 .pages{grid-template-columns:repeat(2,minmax(0,1fr))}
 .toolbar button{flex:1}
}
</style>
</head>
<body>

<header>
 <div class="logo">MEU <span>PDF</span></div>
 <div class="actions">

  <button id="portalBtn">← Portal</button>

<section class="hero">

 <p>Converta, organize, edite e compartilhe documentos em um só lugar.</p>
</section>

<main>
<section id="home">
 <input class="search" id="search" placeholder="🔎 Pesquisar ferramentas...">

 <div class="grid" id="grid"></div>
</section>

<section id="workspace" hidden>

 <div class="panel">
  <h2 id="toolTitle"></h2>

  <label class="drop">

  <div id="options"></div>

 </div>

<footer>BUSINESS PRO · MEU PDF</footer>

<script>
"use strict";

const $ = id => document.getElementById(id);

const tools = [
 {id:"images",name:"Imagens para PDF",icon:"📸",cat:"Converter imagens",desc:"Junte várias fotos em um único PDF."},
 {id:"pdfjpg",name:"PDF para JPG",icon:"🖼️",cat:"Converter imagens",desc:"Transforme páginas de PDF em imagens JPG."},
 {id:"pdfpng",name:"PDF para PNG",icon:"🎨",cat:"Converter imagens",desc:"Converta páginas do PDF para PNG."},
 {id:"merge",name:"Juntar PDF",icon:"📚",cat:"Organizar PDF",desc:"Una vários documentos em um PDF."},
 {id:"split",name:"Dividir PDF",icon:"✂️",cat:"Organizar PDF",desc:"Extraia páginas selecionadas."},
 {id:"organize",name:"Organizar PDF",icon:"🔀",cat:"Organizar PDF",desc:"Altere a ordem das páginas."},
 {id:"rotate",name:"Girar PDF",icon:"🔄",cat:"Organizar PDF",desc:"Gire as páginas do documento."},
 {id:"delete",name:"Excluir páginas",icon:"🗑️",cat:"Organizar PDF",desc:"Remova páginas desnecessárias."},
 {id:"compress",name:"Comprimir PDF",icon:"📦",cat:"Otimizar PDF",desc:"Recrie o documento com imagens compactadas."},
 {id:"word",name:"PDF para Word",icon:"📝",cat:"Converter PDF",desc:"Extraia o texto do PDF para editar no Word."},
 {id:"wordpdf",name:"Word para PDF",icon:"📄",cat:"Converter PDF",desc:"Converta o conteúdo de arquivos DOCX."},
 {id:"excel",name:"PDF para Excel",icon:"📊",cat:"Converter PDF",desc:"Exporte o texto extraído para CSV, compatível com Excel."},
 {id:"ppt",name:"PDF para PowerPoint",icon:"📽️",cat:"Converter PDF",desc:"Exporte as páginas como imagens para apresentações."},
 {id:"edit",name:"Editar PDF",icon:"✏️",cat:"Editar PDF",desc:"Adicione texto às páginas do documento."},
 {id:"number",name:"Numerar páginas",icon:"🔢",cat:"Editar PDF",desc:"Adicione numeração automática."},
 {id:"watermark",name:"Marca d'água",icon:"💧",cat:"Editar PDF",desc:"Adicione uma marca d'água."},
 {id:"metadata",name:"Informações do PDF",icon:"ℹ️",cat:"PDF Intelligence",desc:"Veja quantidade de páginas e dados do arquivo."},
 {id:"extract",name:"Extrair texto",icon:"📋",cat:"PDF Intelligence",desc:"Leia o texto selecionável de um PDF."},
 {id:"protect",name:"Proteger PDF",icon:"🔒",cat:"Segurança de PDF",desc:"Informações sobre proteção de documentos."},
 {id:"unlock",name:"Desbloquear PDF",icon:"🔓",cat:"Segurança de PDF",desc:"Verifique documentos com restrições."},
 {id:"workflow",name:"Fluxos de trabalho",icon:"⚙️",cat:"Fluxos de trabalho",desc:"Organize seus arquivos em operações."}
];

let category="Todas";
let active=null;
let selected=[];
let output=null;
let outputURL=null;
let working=false;

function theme(value){
 document.body.classList.toggle("light",value==="light");
 $("themeBtn").textContent=value==="light"?"🌙 Escuro":"☀ Claro";
 try{localStorage.setItem("businesspro_theme_v2",value)}catch(e){}
}

let savedTheme="dark";
try{
 const query=new URLSearchParams(location.search).get("bp_theme");
 savedTheme=query||localStorage.getItem("businesspro_theme_v2")||"dark";
}catch(e){}
theme(savedTheme);

$("themeBtn").onclick=()=>{
 theme(document.body.classList.contains("light")?"dark":"light");
};

$("portalBtn").onclick=()=>location.href="../";

function renderHome(){
 const cats=["Todas",...new Set(tools.map(t=>t.cat))];
 $("filters").replaceChildren();

 cats.forEach(c=>{
  const b=document.createElement("button");
  b.textContent=c;
  b.className=c===category?"active":"";
  b.onclick=()=>{
   category=c;
   renderHome();
  };
  $("filters").appendChild(b);
 });

 const q=$("search").value.toLowerCase();
 $("grid").replaceChildren();

 tools.filter(t=>
  (category==="Todas"||t.cat===category)&&
  (t.name+" "+t.desc+" "+t.cat).toLowerCase().includes(q)
 ).forEach(t=>{
  const card=document.createElement("article");
  card.className="tool";
  card.tabIndex=0;

  const emoji=document.createElement("div");
  emoji.className="emoji";
  emoji.textContent=t.icon;

  const h=document.createElement("h3");
  h.textContent=t.name;

  const p=document.createElement("p");
  p.textContent=t.desc;

  card.append(emoji,h,p);
  card.onclick=()=>openTool(t.id);
  card.onkeydown=e=>{
   if(e.key==="Enter")openTool(t.id);
  };
  $("grid").appendChild(card);
 });
}

$("search").oninput=renderHome;

function status(message){
 $("status").textContent=message;
}

function invalidate(){
 output=null;
 $("result").hidden=true;
 $("preview").hidden=true;
 $("preview").removeAttribute("src");

 if(outputURL){
  URL.revokeObjectURL(outputURL);
  outputURL=null;
 }
}

function clearSelected(){
 selected.forEach(x=>URL.revokeObjectURL(x.url));
 selected=[];
 invalidate();
 renderSelected();
}

function openTool(id){
 clearSelected();
 active=tools.find(t=>t.id===id);

 $("home").hidden=true;
 $("workspace").hidden=false;
 $("toolTitle").textContent=active.icon+" "+active.name;
 $("toolDescription").textContent=active.desc;
 $("options").replaceChildren();
 $("files").value="";
 status("");

 const image=id==="images";
 const docx=id==="wordpdf";

 $("files").accept=image
  ?"image/jpeg,image/png,image/webp"
  :docx
   ?".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
   :".pdf,application/pdf";

 $("acceptLabel").textContent=image
  ?"Selecione várias fotos JPG, PNG ou WEBP"
  :docx?"Selecione um arquivo DOCX":"Selecione arquivos PDF";

 $("files").multiple=["images","merge"].includes(id);

 if(id==="images"){
  addSelect("paper","Tamanho das páginas",[
   ["a4","A4"],["letter","Carta"],["legal","Ofício"]
  ]);
  addSelect("orientation","Orientação",[
   ["auto","Automática"],["portrait","Vertical"],["landscape","Horizontal"]
  ]);
  addSelect("margin","Margens",[
   ["10","Normal"],["5","Pequena"],["0","Sem margem"]
  ]);
 }

 if(["split","delete","organize"].includes(id)){
  addInput("pageRange",
   id==="organize"
    ?"Ordem das páginas (ex.: 3,1,2)"
    :"Páginas (ex.: 1,3,5-8)",
   id==="organize"?"3,1,2":"1-3");
 }

 if(id==="rotate"){
  addSelect("angle","Rotação",[
   ["90","90°"],["180","180°"],["270","270°"]
  ]);
 }

 if(["edit","watermark"].includes(id)){
  addInput("customText",
   id==="edit"?"Texto para adicionar":"Marca d'água",
   "MEU PDF");
 }

 if(id==="compress"){
  addSelect("quality","Qualidade",[
   ["0.85","Alta"],["0.65","Média"],["0.4","Menor arquivo"]
  ]);
 }

 if(["protect","unlock","workflow"].includes(id)){
  const p=document.createElement("p");
  p.className="notice";
  p.textContent=id==="protect"
   ?"A proteção por senha exige uma biblioteca específica e não está implementada nesta versão."
   :id==="unlock"
    ?"Este aplicativo não remove senhas ou restrições de arquivos protegidos."
    :"Selecione uma das ferramentas disponíveis para executar a operação desejada.";
  $("options").appendChild(p);
 }

 renderSelected();
 scrollTo({top:0,behavior:"smooth"});
}

function addInput(id,label,placeholder){
 const wrapper=document.createElement("label");
 wrapper.className="field";
 wrapper.textContent=label;

 const input=document.createElement("input");
 input.id=id;
 input.placeholder=placeholder;
 input.type="text";

 wrapper.appendChild(input);
 $("options").appendChild(wrapper);
}

function addSelect(id,label,items){
 const wrapper=document.createElement("label");
 wrapper.className="field";
 wrapper.textContent=label;

 const select=document.createElement("select");
 select.id=id;

 items.forEach(([value,text])=>{
  const option=document.createElement("option");
  option.value=value;
  option.textContent=text;
  select.appendChild(option);
 });

 wrapper.appendChild(select);
 $("options").appendChild(wrapper);
}

$("back").onclick=()=>{
 clearSelected();
 active=null;
 $("workspace").hidden=true;
 $("home").hidden=false;
 renderHome();
};

$("addFiles").onclick=()=>$("files").click();

$("files").onchange=e=>{
 const incoming=Array.from(e.target.files||[]);

 if(!["images","merge"].includes(active.id)){
  clearSelected();
 }

 incoming.forEach(file=>{
  selected.push({
   file,
   url:URL.createObjectURL(file)
  });
 });

 e.target.value="";
 invalidate();
 renderSelected();
};

$("clearFiles").onclick=clearSelected;

$("reverseFiles").onclick=()=>{
 selected.reverse();
 invalidate();
 renderSelected();
};

function move(index,dir){
 const target=index+dir;
 if(target<0||target>=selected.length)return;

 [selected[index],selected[target]]=
 [selected[target],selected[index]];

 invalidate();
 renderSelected();
}

function renderSelected(){
 const box=$("fileList");
 box.replaceChildren();

 $("count").textContent=selected.length
  ?selected.length+" arquivo(s) selecionado(s)"
  :"Nenhum arquivo selecionado.";

 selected.forEach((item,index)=>{
  const card=document.createElement("div");
  card.className="page";

  if(item.file.type.startsWith("image/")){
   const img=document.createElement("img");
   img.src=item.url;
   img.alt=item.file.name;
   card.appendChild(img);
  }else{
   const icon=document.createElement("div");
   icon.style.cssText="font-size:45px;text-align:center;padding:30px 0";
   icon.textContent="📄";
   card.appendChild(icon);
  }

  const name=document.createElement("small");
  name.textContent=(index+1)+". "+item.file.name;

  const actions=document.createElement("div");
  actions.className="toolbar";

  const up=document.createElement("button");
  up.textContent="↑";
  up.disabled=index===0;
  up.onclick=()=>move(index,-1);

  const down=document.createElement("button");
  down.textContent="↓";
  down.disabled=index===selected.length-1;
  down.onclick=()=>move(index,1);

  const remove=document.createElement("button");
  remove.textContent="✕";
  remove.onclick=()=>{
   URL.revokeObjectURL(item.url);
   selected.splice(index,1);
   invalidate();
   renderSelected();
  };

  actions.append(up,down,remove);
  card.append(name,actions);
  box.appendChild(card);
 });
}

async function loadImage(url){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>resolve(img);
  img.onerror=()=>reject(new Error("Erro ao abrir imagem."));
  img.src=url;
 });
}

function jpegFromImage(img,quality=.85){
 const scale=Math.min(
  1,2200/Math.max(img.naturalWidth,img.naturalHeight)
 );
 const canvas=document.createElement("canvas");
 canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
 canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));

 const ctx=canvas.getContext("2d");
 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(img,0,0,canvas.width,canvas.height);

 return {
  data:canvas.toDataURL("image/jpeg",quality),
  width:canvas.width,
  height:canvas.height
 };
}

async function imagesToPDF(){
 if(!window.jspdf?.jsPDF)throw Error("jsPDF não carregou.");

 const {jsPDF}=window.jspdf;
 const format=$("paper").value;
 const orientation=$("orientation").value;
 const margin=Number($("margin").value);

 let pdf=null;

 for(let i=0;i<selected.length;i++){
  status("Processando imagem "+(i+1)+" de "+selected.length);

  const loaded=await loadImage(selected[i].url);
  const img=jpegFromImage(loaded);

  let pageW=210,pageH=297;

  if(format==="letter"){
   pageW=215.9;
   pageH=279.4;
  }
  if(format==="legal"){
   pageW=215.9;
   pageH=355.6;
  }

  const landscape=orientation==="auto"
   ?img.width>img.height
   :orientation==="landscape";

  if(landscape)[pageW,pageH]=[pageH,pageW];

  if(!pdf){
   pdf=new jsPDF({
    unit:"mm",
    format:[pageW,pageH],
    compress:true
   });
  }else{
   pdf.addPage([pageW,pageH]);
  }

  const ratio=Math.min(
   (pageW-2*margin)/img.width,
   (pageH-2*margin)/img.height
  );

  const w=img.width*ratio;
  const h=img.height*ratio;

  pdf.addImage(
   img.data,"JPEG",
   (pageW-w)/2,(pageH-h)/2,w,h,
   undefined,"FAST"
  );

  await new Promise(r=>setTimeout(r,0));
 }

 return {
  blob:pdf.output("blob"),
  name:"imagens-unidas.pdf"
 };
}

function requirePDFLib(){
 if(!window.PDFLib)throw Error("Biblioteca PDF não carregou.");
 return window.PDFLib;
}

async function openPDF(file){
 const {PDFDocument}=requirePDFLib();
 return PDFDocument.load(await file.arrayBuffer());
}

function parsePages(text,total){
 const result=[];

 for(const part of text.split(",")){
  const p=part.trim();
  if(!p)continue;

  if(p.includes("-")){
   const [a,b]=p.split("-").map(Number);
   if(!Number.isInteger(a)||!Number.isInteger(b))
    throw Error("Intervalo inválido.");

   const step=a<=b?1:-1;
   for(let n=a;step>0?n<=b:n>=b;n+=step){
    if(n<1||n>total)throw Error("Página fora do intervalo.");
    result.push(n-1);
   }
  }else{
   const n=Number(p);
   if(!Number.isInteger(n)||n<1||n>total)
    throw Error("Página inválida: "+p);
   result.push(n-1);
  }
 }

 if(!result.length)throw Error("Informe as páginas.");
 return result;
}

async function modifyPDF(id){
 const {PDFDocument,degrees,rgb,StandardFonts}=requirePDFLib();

 if(id==="merge"){
  const out=await PDFDocument.create();

  for(const item of selected){
   const source=await openPDF(item.file);
   const copied=await out.copyPages(
    source,source.getPageIndices()
   );
   copied.forEach(page=>out.addPage(page));
  }

  return {
   blob:new Blob([await out.save()],{type:"application/pdf"}),
   name:"pdf-unido.pdf"
  };
 }

 const source=await openPDF(selected[0].file);
 const total=source.getPageCount();

 if(id==="split"||id==="organize"||id==="delete"){
  const range=$("pageRange").value.trim();

  if(!range)throw Error("Informe as páginas.");

  const indices=parsePages(range,total);
  let keep=indices;

  if(id==="delete"){
   const remove=new Set(indices);
   keep=source.getPageIndices().filter(i=>!remove.has(i));
  }

  if(!keep.length)throw Error("Nenhuma página restante.");

  const out=await PDFDocument.create();
  const copied=await out.copyPages(source,keep);
  copied.forEach(page=>out.addPage(page));

  return {
   blob:new Blob([await out.save()],{type:"application/pdf"}),
   name:id==="split"?"paginas-extraidas.pdf":
    id==="delete"?"paginas-removidas.pdf":"pdf-organizado.pdf"
  };
 }

 if(id==="rotate"){
  const angle=Number($("angle").value);
  source.getPages().forEach(page=>{
   const current=page.getRotation().angle;
   page.setRotation(degrees((current+angle)%360));
  });
 }

 if(["edit","watermark","number"].includes(id)){
  const font=await source.embedFont(StandardFonts.Helvetica);
  const text=$("customText")?.value||"MEU PDF";

  source.getPages().forEach((page,i)=>{
   const {width,height}=page.getSize();

   if(id==="number"){
    page.drawText(String(i+1),{
     x:width/2,y:20,size:12,font,
     color:rgb(.25,.25,.25)
    });
   }else if(id==="edit"){
    page.drawText(text,{
     x:30,y:height-40,size:16,font,
     color:rgb(.1,.2,.6),
     maxWidth:width-60
    });
   }else{
    page.drawText(text,{
     x:Math.max(20,width*.15),
     y:height*.5,
     size:Math.min(35,width/10),
     font,
     opacity:.25,
     rotate:degrees(-25),
     color:rgb(.5,.5,.5)
    });
   }
  });
 }

 if(id==="compress"){
  // Regrava a estrutura do PDF.
  // Não garante redução de tamanho de imagens já compactadas.
 }

 return {
  blob:new Blob(
   [await source.save({useObjectStreams:true})],
   {type:"application/pdf"}
  ),
  name:{
   rotate:"pdf-girado.pdf",
   edit:"pdf-editado.pdf",
   number:"pdf-numerado.pdf",
   watermark:"marca-dagua.pdf",
   compress:"pdf-otimizado.pdf"
  }[id]||"resultado.pdf"
 };
}

function requirePDFJS(){
 if(!window.pdfjsLib)throw Error("PDF.js não carregou.");
 pdfjsLib.GlobalWorkerOptions.workerSrc=
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 return pdfjsLib;
}

async function readPDF(file){
 const lib=requirePDFJS();
 const data=new Uint8Array(await file.arrayBuffer());
 return lib.getDocument({data}).promise;
}

async function extractText(pdf){
 const pages=[];

 for(let i=1;i<=pdf.numPages;i++){
  const page=await pdf.getPage(i);
  const content=await page.getTextContent();
  pages.push(content.items.map(x=>x.str).join(" "));
 }

 return pages;
}

async function pdfToImages(id){
 const pdf=await readPDF(selected[0].file);
 const files=[];

 for(let i=1;i<=pdf.numPages;i++){
  status("Convertendo página "+i+" de "+pdf.numPages);

  const page=await pdf.getPage(i);
  const viewport=page.getViewport({scale:1.7});

  const canvas=document.createElement("canvas");
  canvas.width=Math.ceil(viewport.width);
  canvas.height=Math.ceil(viewport.height);

  const ctx=canvas.getContext("2d");
  await page.render({
   canvasContext:ctx,
   viewport
  }).promise;

  const type=id==="pdfpng"?"image/png":"image/jpeg";
  const blob=await new Promise(resolve=>
   canvas.toBlob(resolve,type,.88)
  );

  files.push({
   blob,
   name:"pagina-"+i+(id==="pdfpng"?".png":".jpg")
  });

  canvas.width=0;
  canvas.height=0;
 }

 return files;
}

async function convertText(id){
 const pdf=await readPDF(selected[0].file);
 const pages=await extractText(pdf);

 if(id==="excel"){
  const csv="Página;Texto\n"+pages.map((text,i)=>
   (i+1)+';"'+text.replace(/"/g,'""')+'"'
  ).join("\n");

  return {
   blob:new Blob(["\ufeff"+csv],{
    type:"text/csv;charset=utf-8"
   }),
   name:"pdf-para-excel.csv"
  };
 }

 const content=pages.map((p,i)=>
  "PÁGINA "+(i+1)+"\n\n"+p
 ).join("\n\n----------------\n\n");

 return {
  blob:new Blob([content],{
   type:"text/plain;charset=utf-8"
  }),
  name:id==="word"?"texto-do-pdf.txt":"texto-extraido.txt"
 };
}

async function wordToPDF(){
 if(!window.mammoth?.extractRawText)
  throw Error("Biblioteca DOCX indisponível.");

 const file=selected[0].file;
 const result=await mammoth.extractRawText({
  arrayBuffer:await file.arrayBuffer()
 });

 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF();

 const lines=pdf.splitTextToSize(result.value||"Documento vazio",180);
 let y=20;

 lines.forEach(line=>{
  if(y>275){
   pdf.addPage();
   y=20;
  }
  pdf.text(line,15,y);
  y+=7;
 });

 return {
  blob:pdf.output("blob"),
  name:"documento-convertido.pdf"
 };
}

async function information(){
 const pdf=await readPDF(selected[0].file);
 const info=await pdf.getMetadata();

 const text=[
  "INFORMAÇÕES DO PDF",
  "",
  "Arquivo: "+selected[0].file.name,
  "Páginas: "+pdf.numPages,
  "Tamanho: "+selected[0].file.size+" bytes",
  "Título: "+(info.info?.Title||"Não informado"),
  "Autor: "+(info.info?.Author||"Não informado")
 ].join("\n");

 return {
  blob:new Blob([text],{type:"text/plain"}),
  name:"informacoes-pdf.txt"
 };
}

function saveResult(result){
 invalidate();
 output=result;
 outputURL=URL.createObjectURL(result.blob);

 $("result").hidden=false;
 $("resultName").textContent=
  result.name+" · "+
  (result.blob.size/1024/1024).toFixed(2)+" MB";

 status("Arquivo gerado com sucesso.");
 $("result").scrollIntoView({behavior:"smooth"});
}

$("process").onclick=async()=>{
 if(working)return;

 if(!selected.length){
  status("Selecione um arquivo primeiro.");
  return;
 }

 const id=active.id;

 if(["protect","unlock","workflow"].includes(id)){
  status("Essa operação ainda não está implementada.");
  return;
 }

 working=true;
 $("process").disabled=true;
 status("Processando...");

 try{
  let result;

  if(id==="images"){
   result=await imagesToPDF();
  }else if([
   "merge","split","organize","rotate","delete",
   "compress","edit","number","watermark"
  ].includes(id)){
   result=await modifyPDF(id);
  }else if(id==="pdfjpg"||id==="pdfpng"||id==="ppt"){
   const files=await pdfToImages(
    id==="ppt"?"pdfpng":id
   );

   if(files.length===1){
    result=files[0];
   }else{
    // Os navegadores não criam ZIP sem uma biblioteca adicional.
    // Neste caso, baixa cada imagem separadamente.
    for(const item of files){
     const url=URL.createObjectURL(item.blob);
     const a=document.createElement("a");
     a.href=url;
     a.download=item.name;
     a.click();
     setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
    status(files.length+" imagens geradas. Confira seus downloads.");
    return;
   }
  }else if(["word","excel","extract"].includes(id)){
   result=await convertText(id);
  }else if(id==="wordpdf"){
   result=await wordToPDF();
  }else if(id==="metadata"){
   result=await information();
  }else{
   throw Error("Ferramenta não implementada.");
  }

  saveResult(result);
 }catch(error){
  console.error(error);
  status("Erro: "+error.message);
 }finally{
  working=false;
  $("process").disabled=false;
 }
};

$("download").onclick=()=>{
 if(!outputURL||!output)return;

 const a=document.createElement("a");
 a.href=outputURL;
 a.download=output.name;
 document.body.appendChild(a);
 a.click();
 a.remove();
};

$("share").onclick=async()=>{
 if(!output)return;

 const file=new File(
  [output.blob],
  output.name,
  {type:output.blob.type||"application/octet-stream"}
 );

 try{
  if(navigator.share&&navigator.canShare?.({files:[file]})){
   await navigator.share({
    title:"MEU PDF",
    files:[file]
   });
  }else{
   $("download").click();
   status("Compartilhamento direto indisponível. Arquivo baixado.");
  }
 }catch(error){
  if(error.name!=="AbortError")
   status("Não foi possível compartilhar.");
 }
};

$("previewBtn").onclick=()=>{
 if(!outputURL||!output)return;

 if($("preview").hidden){
  $("preview").src=outputURL;
  $("preview").hidden=false;
 }else{
  $("preview").hidden=true;
  $("preview").removeAttribute("src");
 }
};

window.addEventListener("beforeunload",()=>{
 selected.forEach(x=>URL.revokeObjectURL(x.url));
 if(outputURL)URL.revokeObjectURL(outputURL);
});

renderHome();
</script>
